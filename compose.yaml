# Local stack: PostgreSQL + migrations + Next.js production build.
#   docker compose up -d --build   → site on http://localhost:3000
#   docker compose up -d db        → database only, for "npm run dev"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      # 5433 on the host so it does not clash with a locally installed PostgreSQL
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      SESSION_SECRET: ${SESSION_SECRET:-local-docker-secret-change-me-0123456789}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
